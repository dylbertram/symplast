name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-tools:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install website dependencies
        run: npm ci --prefix site
      - name: Validate release tools and website
        run: |
          bash -n scripts/build-app.sh scripts/package-release.sh scripts/fetch-mutagen.sh
          python3 -m unittest discover -s tests-release -v
          python3 scripts/build-site.py
          npm run check --prefix site
          python3 scripts/verify-site.py
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
